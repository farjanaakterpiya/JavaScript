<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>Prime Number</h3>
   <script>
    
    let mynum= prompt("Enter a number","");
    mynum = parseInt(mynum);


    function checkPrime(x){
     if(x==1){
        alert(x + "is a prime number");
        return;
     }else if(x==2){
        alert(x+ "Not is a prime number");
        return;
     } else{
        for(let i=2; i<x; i++){
        if(x%i== 0){
          alert(x+ "Not is a prime number");
        return;  
        }
        }
         alert(x + "is a prime number");
        return;
     }  
    }//function close
    checkPrime(mynum);
   </script> 
</body>
</html>
