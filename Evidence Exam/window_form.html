<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function mywindow(){
            // alert("Hello");
            let name = document.myform.name.value;
            let contact = document.myform.contact.value;
            let remarks = document.myform.remarks.value;
            let gender = document.myform.gender.value;
            let location = document.myform.location.value;
            
            let output="";
            output += "Name:" +name + "<br>";
            output+= "Contact:" +contact + "<br>";
            output+= "Remarks:" +remarks + "<br>";
            output+= "Gender:" +gender + "<br>";
            output+= "Location:" +location + "<br>";
            let checkboxOutput ="";
            const checkbox = document.getElementsByClassName("checkbox");
            // console.log(checkbox.length);
            for(let i=0; i<checkbox.length; i++){
                if(checkbox[i].checked){
                    checkboxOutput+=checkbox[i].value + ",";
                }
            }



            mywindow =window.open("","", "height:300px, width:300px");
            mywindow.document.write(output);
           
            
        }
       
    </script>



    <form action="" name="myform">
        <input type="text" name="name" placeholder="Enter your name"><br>
        <input type="text" name="contact" placeholder="Enter your contact"><br>
        <textarea name="remarks" id="">remarks</textarea><br>
        Gender:
        <input type="radio" name="gender" value="male">Male
        <input type="radio" name="gender" value="female">Female<br>
        Checkbox:
        <input type="checkbox" name="multiple courses" value="NT">NT
        <input type="checkbox" name="multiple courses" value="IAD">IAD
        <input type="checkbox" name="multiple courses" value="DDD">DDD
        <input type="checkbox" name="multiple courses" value="ESAD">ESAD<br>
        <select name="location">
            <option value="" >select one</option>
            <option value="">Like</option>
            <option value="">Banani</option>
            <option value="">Dhanmondi</option>
            <option value="">Mirpur</option>
        </select><br>
        <input type="button" onclick="mywindow()" name="submit" value="OPEN">
    </form>
</body>
</html>
