<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let trafficlight=prompt("Enter the traffic light color");
        
        switch(trafficlight){
            case "red":
                
                document.write("Run");
                break;
            case "yellow":
               
                document.write("Get ready");
                break;
            case "green":
                
                document.write("Proceed");
                break;
            default:
                
                document.write("Invalid color");
        }
    </script>
</body>
</html>
