<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .class{
            background-color: blue;
            color: aliceblue;
        }
    </style>
</head>
<body>
    <div id="show"></div>
    <form action=""name="myform">
        
        
        <input type="text" name="name" placeholder="Enter full name"/><br>
        <textarea name="address" placeholder="Enter address"></textarea><br>
        <input type="button" onclick="mywindow()" name="submit" value="Open"/>
        <input type="button" onclick="mywindow()" name="submit" value="Close"/>

        
    </form>
    <script>
        function mywindow(){
            
            let name = document.myform.name.value;
            let address = document.myform.address.value;
            let output = "<div class='blue'>";
                output+= name +"<br>";
                output += address +"<br>";
               
                 output+="</div>";
                
                // document.getElementById("show").innerHTML=output;
                
                mywindow = window.open("","", "height:300,width:400");
                mywindow.document.write(output);
            }
    </script>
</body>
</html>
